esphome:
  name: esphome-web-termostat     # hagyd, ahogy a varázsló adta
  friendly_name: Fűtés termosztát

esp8266:
  board: esp12e                   # FONTOS: esp01_1m helyett!
  restore_from_flash: true

logger:

api:
  encryption:
    key: !secret esphome_web_termostat__encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "csutrinka2"
    password: "fiatalsag123AB"

captive_portal:

i2c:
  sda: GPIO4
  scl: GPIO14
  frequency: 50kHz

switch:
  - platform: gpio
    pin: GPIO5
    id: kazan_rele
    name: "Kazán relé"
    restore_mode: ALWAYS_OFF

sensor:
  - platform: bmp280_i2c
    address: 0x76
    update_interval: 30s
    temperature:
      name: "Backup hőmérséklet (BMP280)"
      id: bmp_temp
      filters:
        - offset: 0.0
    pressure:
      name: "Légnyomás"

  - platform: homeassistant
    id: ha_atlag
    entity_id: sensor.ha_atlag_hofok   # a HA átlag-helper entitása
    internal: true

  - platform: template
    id: szabalyozo_homerseklet
    name: "Szabályozó hőmérséklet"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    update_interval: 15s
    lambda: |-
      if (global_api_server->is_connected() && !isnan(id(ha_atlag).state)) {
        return id(ha_atlag).state;
      }
      return id(bmp_temp).state;

binary_sensor:
  - platform: template
    name: "HA átlag aktív"
    lambda: |-
      return global_api_server->is_connected() && !isnan(id(ha_atlag).state);

font:
  - file: "gfonts://Roboto"
    id: f_normal
    size: 14
    glyphs: "0123456789.:°[]-% ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÖŐÚÜŰabcdefghijklmnopqrstuvwxyzáéíóöőúüű"

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: 2s
    lambda: |-
      auto c = id(futes_klima);
      bool ha_el = global_api_server->is_connected() && !isnan(id(ha_atlag).state);
      // Felső sárga sáv
      it.print(0, 1, id(f_normal), "Kazán:");
      it.print(128, 1, id(f_normal), TextAlign::TOP_RIGHT,
        id(kazan_rele).state ? "FŰT" : "áll");
      // Kék zóna
      it.print(0, 19, id(f_normal), "Cél:");
      it.printf(128, 19, id(f_normal), TextAlign::TOP_RIGHT, "%.1f °C",
        c->target_temperature);
      it.printf(0, 34, id(f_normal), "Most [%s]:", ha_el ? "HA" : "--");
      if (ha_el) {
        it.printf(128, 34, id(f_normal), TextAlign::TOP_RIGHT, "%.1f °C",
          id(ha_atlag).state);
      } else {
        it.print(128, 34, id(f_normal), TextAlign::TOP_RIGHT, "--");
      }
      it.print(0, 49, id(f_normal), "Helyi:");
      it.printf(128, 49, id(f_normal), TextAlign::TOP_RIGHT, "%.1f °C",
        id(bmp_temp).state);

climate:
  - platform: thermostat
    id: futes_klima
    name: "Fűtés"
    sensor: szabalyozo_homerseklet
    heat_action:
      - switch.turn_on: kazan_rele
    idle_action:
      - switch.turn_off: kazan_rele
    heat_deadband: 0.3
    heat_overrun: 0.3
    min_heating_off_time: 300s
    min_heating_run_time: 300s
    min_idle_time: 60s
    visual:
      min_temperature: 10
      max_temperature: 28
      temperature_step: 0.5
    default_preset: Otthon
    on_boot_restore_from: memory
    preset:
      - name: Otthon
        default_target_temperature_low: 21.5
        mode: heat
      - name: Távol
        default_target_temperature_low: 17
        mode: heat
esphome:
  name: esphome-web-termostat
  friendly_name: Fűtés termosztát

esp8266:
  board: esp12e
  restore_from_flash: true

logger:

api:
  encryption:
    key: !secret esphome_web_termostat__encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "csutrinka2"
    password: "fiatalsag123AB"

captive_portal:

i2c:
  sda: GPIO4
  scl: GPIO14
  frequency: 50kHz

switch:
  - platform: gpio
    pin: GPIO5
    id: kazan_rele
    name: "Kazán relé"
    restore_mode: ALWAYS_OFF

sensor:
  - platform: bmp280_i2c
    address: 0x76
    update_interval: 30s
    temperature:
      name: "Hőmérséklet (BMP280)"
      id: bmp_temp
      filters:
        - offset: 0.0
    pressure:
      name: "Légnyomás"

font:
  - file: "gfonts://Roboto"
    id: f_normal
    size: 14
    glyphs: "0123456789.:°[]-% ABCDEFGHIJKLMNOPQRSTUVWXYZÁÉÍÓÖŐÚÜŰabcdefghijklmnopqrstuvwxyzáéíóöőúüű"

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: 2s
    lambda: |-
      auto c = id(futes_klima);
      // Felső sárga sáv
      it.print(0, 1, id(f_normal), "Kazán:");
      it.print(128, 1, id(f_normal), TextAlign::TOP_RIGHT,
        id(kazan_rele).state ? "FŰT" : "áll");
      // Kék zóna
      it.print(0, 22, id(f_normal), "Cél:");
      it.printf(128, 22, id(f_normal), TextAlign::TOP_RIGHT, "%.1f °C",
        c->target_temperature);
      it.print(0, 42, id(f_normal), "Most:");
      it.printf(128, 42, id(f_normal), TextAlign::TOP_RIGHT, "%.1f °C",
        id(bmp_temp).state);

climate:
  - platform: thermostat
    id: futes_klima
    name: "Fűtés"
    sensor: bmp_temp
    heat_action:
      - switch.turn_on: kazan_rele
    idle_action:
      - switch.turn_off: kazan_rele
    heat_deadband: 0.3
    heat_overrun: 0.3
    min_heating_off_time: 300s
    min_heating_run_time: 300s
    min_idle_time: 60s
    visual:
      min_temperature: 10
      max_temperature: 28
      temperature_step: 0.5
    default_preset: Otthon
    on_boot_restore_from: memory
    preset:
      - name: Otthon
        default_target_temperature_low: 21.5
        mode: heat
      - name: Távol
        default_target_temperature_low: 17
        mode: heat